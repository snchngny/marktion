name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test editor and shared commands
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          pnpm --filter @markra/shared test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @markra/editor test --maxWorkers=1 --no-file-parallelism
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable and installer
        run: pnpm tauri build --bundles nsis -- --locked
      - name: Prepare downloadable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-files | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/marktion.exe release-files/marktion.exe
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe release-files/
          Copy-Item LICENSE release-files/LICENSE.txt
          git archive --format=zip --prefix=marktion/ -o release-files/marktion-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release-files -File | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content release-files/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: marktion-windows-x64-${{ github.sha }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marktion-windows-x64-${{ github.sha }}
          path: release-files
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-files/* --verify-tag \
            --title "marktion $RELEASE_TAG" \
            --notes 'Windows x64版。実行ファイルとインストーラーは未署名です。対応ソース・AGPLライセンス・SHA256SUMSを添付しています。'
